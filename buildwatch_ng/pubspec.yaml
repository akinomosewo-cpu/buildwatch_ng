name: buildwatch_ng
description: Remote build monitoring app with geotagged photo check-ins and live BOQ pricing.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.4
  bloc: ^8.1.4
  equatable: ^2.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dartz: ^0.10.1
  intl: ^0.19.0
  uuid: ^4.3.3
  crypto: ^3.0.3
  image_picker: ^1.2.3
  geolocator: ^11.0.0
  camera: ^0.12.1
  google_fonts: ^6.3.3
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  iconsax: ^0.0.8
  cached_network_image: ^3.3.1
  fl_chart: ^0.67.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
flutter:
  uses-material-design: true
